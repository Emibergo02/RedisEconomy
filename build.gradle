plugins {
    id 'java'
    id 'com.gradleup.shadow' version "9.6.1"
}

group = 'dev.unnm3d'
version = '4.5.13'

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
    maven {
        url 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        url 'https://repo.extendedclip.com/content/repositories/placeholderapi/'
    }
    maven {
        url 'https://repo.essentialsx.net/releases/'
    }
}

dependencies {
    // Oldest supported server API: keeps the compiled references loadable on 1.20.x and newer (26.x)
    compileOnly 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    // Adventure version bundled with Paper 1.20.1; newer servers (26.x, adventure 5.x) keep these APIs
    compileOnly 'net.kyori:adventure-text-minimessage:4.14.0'
    implementation 'io.lettuce:lettuce-core:7.6.0.RELEASE'
    implementation 'de.exlll:configlib-yaml:4.8.0'
    implementation 'com.github.Anon8281:UniversalScheduler:0.1.6'

    compileOnly 'com.github.MilkBowl:VaultAPI:1.7.1'
    compileOnly 'me.clip:placeholderapi:2.11.6'
    compileOnly('net.essentialsx:EssentialsX:2.21.2') {
        exclude group: 'org.spigotmc', module: 'spigot-api'
    }
    compileOnly 'com.github.Zrips:CMI-API:9.8.6.4'
    compileOnly(files('libs/XConomy-Bukkit-2.26.3.jar'))

    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation 'io.papermc.paper:paper-api:1.20.1-R0.1-SNAPSHOT'
    testImplementation 'com.github.MilkBowl:VaultAPI:1.7.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.assertj:assertj-core:3.25.3'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    jvmArgs '-Dnet.bytebuddy.experimental=true', '-XX:+EnableDynamicAgentLoading', '-Xmx1024m'
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

jar {
    archiveClassifier.set('original')
}

shadowJar {
    destinationDirectory.set(file("$rootDir/target"))
    archiveClassifier.set('')

    relocate 'de.exlll.configlib', 'dev.unnm3d.shaded.configlib'
    relocate 'org.snakeyaml.engine', 'dev.unnm3d.shaded.snakeyaml'
    relocate 'reactor', 'dev.unnm3d.shaded.lettucedep.reactor'
    relocate 'io.lettuce', 'dev.unnm3d.shaded.lettuce'
    relocate 'io.netty', 'dev.unnm3d.shaded.lettucedep.netty'
    relocate 'org.reactivestreams', 'dev.unnm3d.shaded.lettucedep.reactivestreams'
    relocate 'com.github.Anon8281.universalScheduler', 'dev.unnm3d.shaded.universalScheduler'
    minimize()
    exclude 'org/slf4j/**'
}

// Java 21 bytecode: minimum for MC 1.20.x servers on Java 21, forward-compatible with the Java 25 runtime of MC 26.x
def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    filesMatching('source') {
        expand props
    }
}

